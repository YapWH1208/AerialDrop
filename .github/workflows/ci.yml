name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Set up Node for website checks
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate release compatibility
        run: |
          python3 Scripts/release_compatibility.py validate
          python3 Scripts/test-release-compatibility.py
          bash Scripts/test-install.sh
          node --check docs/compatibility.js
          node --check docs/app.js
          node Scripts/test-site-compatibility.js

      - name: Verify website release fallback
        run: ./Scripts/check-docs-version.sh

      - name: Build (debug)
        run: swift build

      - name: Run tests
        run: swift test

      - name: Build release binary
        run: swift build -c release

      - name: Build app bundle
        run: ./Scripts/build-app.sh

      - name: Validate packaged compatibility
        run: python3 Scripts/release_compatibility.py validate --bundle dist/AerialDrop.app
