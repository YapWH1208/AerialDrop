name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Set up Node for website checks
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate release compatibility
        run: |
          python3 Scripts/release_compatibility.py validate
          python3 Scripts/test-release-compatibility.py
          bash Scripts/test-install.sh
          node --check docs/compatibility.js
          node --check docs/app.js
          node Scripts/test-site-compatibility.js
          node Scripts/test-site-interactions.js

      - name: Verify website release fallback
        run: ./Scripts/check-docs-version.sh

      - name: Build (debug)
        run: swift build

      - name: Run tests
        run: swift test

      - name: Build release binary
        run: swift build -c release

      - name: Build and verify an update-enabled app bundle
        run: |
          scratch=$(mktemp -d "$RUNNER_TEMP/aerialdrop-signing.XXXXXX")
          trap 'rm -rf "$scratch"' EXIT
          umask 077
          public_key=$(swift -e '
            import CryptoKit
            import Foundation
            let key = Curve25519.Signing.PrivateKey()
            try key.rawRepresentation.base64EncodedString().write(
              toFile: CommandLine.arguments[1], atomically: true, encoding: .utf8
            )
            print(key.publicKey.rawRepresentation.base64EncodedString())
          ' "$scratch/private-key")
          AERIALDROP_UPDATE_PUBLIC_KEY="$public_key" ./Scripts/build-app.sh

          python3 Scripts/release_compatibility.py validate --bundle dist/AerialDrop.app
          version=$(plutil -extract CFBundleShortVersionString raw -o - dist/AerialDrop.app/Contents/Info.plist)
          archive="$scratch/AerialDrop-$version-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/AerialDrop.app "$archive"
          signer="$PWD/.build/artifacts/sparkle/Sparkle/bin/sign_update"
          AERIALDROP_UPDATE_PRIVATE_KEY="$(cat "$scratch/private-key")" python3 Scripts/sparkle_appcast.py \
            --tag "v$version" --archive "$archive" --sign-tool "$signer" --output "$scratch/appcast.xml"
          SPARKLE_SIGN_TOOL="$signer" python3 Scripts/test-sparkle-appcast.py
          SPARKLE_SIGN_TOOL="$signer" python3 Scripts/test-publish-app-update.py
