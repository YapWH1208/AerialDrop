name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: self-hosted
    env:
      # The self-hosted runner defaults to the Command Line Tools toolchain,
      # which has no XCTest module; Xcode's toolchain is required for `swift test`.
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Run tests
        run: swift test

      - name: Build release binary
        run: swift build -c release

      - name: Build app bundle
        run: ./Scripts/build-app.sh
